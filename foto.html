<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivio fotografico - Lourdes 2026</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
      color: #1f2d3d;
    }

    .contenitore {
      max-width: 1100px;
      margin: 40px auto;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .sottotitolo {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .sezione {
      background: white;
      border: 1px solid #cfd8e3;
      border-radius: 12px;
      padding: 20px;
      margin: 22px 0;
      text-align: left;
    }

    .sezione h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .galleria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .galleria img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }

    .nota {
      color: #666;
      font-size: 15px;
    }

    .indietro {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 22px;
      border: 2px solid #4b79a1;
      border-radius: 10px;
      color: #1f2d3d;
      text-decoration: none;
      font-weight: bold;
      background: white;
    }

    .indietro:hover {
      background: #eaf2f8;
    }
  </style>
</head>

<body>

<div class="contenitore">

  <h1>Archivio fotografico</h1>

  <div class="sottotitolo">
    Il mio viaggio a Lourdes — luglio 2026
  </div>

  <div id="contenuto"></div>

  <a class="indietro" href="index.html">
    Torna alla pagina principale
  </a>

</div>

<script>
const proprietario = "roberto64rm";
const repository = "lourdes2026";
const cartellaBase = "foto";

const sezioni = [
  ["01-preparazione-partenza", "La preparazione e la partenza"],
  ["02-viaggio", "Il viaggio verso Lourdes"],
  ["03-lourdes", "Lourdes e la vita quotidiana"],
  ["04-gruppo", "Il gruppo"],
  ["05-santuario", "Il Santuario"],
  ["06-luoghi-bernadette", "I luoghi di Bernadette"],
  ["07-via-crucis", "La Via Crucis"],
  ["08-ultimi-momenti", "Gli ultimi momenti"],
  ["09-ricordi", "I ricordi conservati"]
];

async function caricaFoto(cartella, titolo) {

  const contenitore = document.getElementById("contenuto");

  const sezione = document.createElement("div");
  sezione.className = "sezione";

  const h2 = document.createElement("h2");
  h2.textContent = titolo;
  sezione.appendChild(h2);

  const galleria = document.createElement("div");
  galleria.className = "galleria";
  sezione.appendChild(galleria);

  contenitore.appendChild(sezione);

  const url =
    `https://api.github.com/repos/${proprietario}/${repository}/contents/${cartellaBase}/${cartella}`;

  try {
    const risposta = await fetch(url);

    if (!risposta.ok) {
      galleria.innerHTML =
        '<div class="nota">Nessuna fotografia disponibile</div>';
      return;
    }

    const files = await risposta.json();

    const immagini = files.filter(file =>
      file.type === "file" &&
      /\.(jpg|jpeg|png|webp)$/i.test(file.name)
    );

    if (immagini.length === 0) {
      galleria.innerHTML =
        '<div class="nota">Nessuna fotografia disponibile</div>';
      return;
    }

    immagini.forEach(file => {

      const img = document.createElement("img");

      img.src = file.download_url;
      img.alt = file.name;
      img.loading = "lazy";

      img.onclick = () => {
        window.open(file.download_url, "_blank");
      };

      galleria.appendChild(img);
    });

  } catch (errore) {
    galleria.innerHTML =
      '<div class="nota">Errore nel caricamento delle fotografie</div>';
  }
}

sezioni.forEach(sezione => {
  caricaFoto(sezione[0], sezione[1]);
});
</script>

</body>
</html>
