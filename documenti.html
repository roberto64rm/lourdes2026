<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documenti - Lourdes 2026</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
      color: #1f2d3d;
    }

    .contenitore {
      max-width: 850px;
      margin: 40px auto;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .sottotitolo {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .documento {
      background: white;
      border: 1px solid #cfd8e3;
      border-radius: 12px;
      padding: 20px;
      margin: 18px 0;
      text-align: left;
    }

    .documento h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .documento a {
      display: inline-block;
      margin-top: 8px;
      color: #245b8a;
      text-decoration: none;
      font-weight: bold;
    }

    .documento a:hover {
      text-decoration: underline;
    }

    .nota {
      color: #666;
      font-size: 15px;
    }

    .indietro {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 22px;
      border: 2px solid #4b79a1;
      border-radius: 10px;
      color: #1f2d3d;
      text-decoration: none;
      font-weight: bold;
      background: white;
    }
  </style>
</head>

<body>

<div class="contenitore">

  <h1>Documenti</h1>

  <div class="sottotitolo">
    Materiali relativi al pellegrinaggio a Lourdes
  </div>

  <div id="elenco-documenti">
    <div class="nota">Caricamento documenti...</div>
  </div>

  <a class="indietro" href="index.html">
    Torna alla pagina principale
  </a>

</div>

<script>

const proprietario = "roberto64rm";
const repository = "lourdes2026";
const cartella = "documenti";

async function caricaDocumenti() {

  const contenitore = document.getElementById("elenco-documenti");

  const url =
    `https://api.github.com/repos/${proprietario}/${repository}/contents/${cartella}`;

  try {

    const risposta = await fetch(url);

    if (!risposta.ok) {
      contenitore.innerHTML =
        '<div class="nota">Nessun documento disponibile</div>';
      return;
    }

    const files = await risposta.json();

    const documenti = files
      .filter(file =>
        file.type === "file" &&
        !file.name.startsWith(".")
      )
      .sort((a, b) => a.name.localeCompare(b.name));

    if (documenti.length === 0) {
      contenitore.innerHTML =
        '<div class="nota">Nessun documento disponibile</div>';
      return;
    }

    contenitore.innerHTML = "";

    documenti.forEach(file => {

      const box = document.createElement("div");
      box.className = "documento";

      const titolo = document.createElement("h2");

      titolo.textContent = file.name
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g, " ");

      const link = document.createElement("a");
      link.href = file.download_url;
      link.target = "_blank";
      link.textContent = "Apri documento";

      box.appendChild(titolo);
      box.appendChild(link);

      contenitore.appendChild(box);

    });

  } catch (errore) {

    contenitore.innerHTML =
      '<div class="nota">Errore nel caricamento dei documenti</div>';

  }
}

caricaDocumenti();

</script>

</body>
</html>
