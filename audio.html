<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrazioni audio - Lourdes 2026</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
      color: #1f2d3d;
    }

    .contenitore {
      max-width: 850px;
      margin: 40px auto;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .sottotitolo {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .audio-box {
      background: white;
      border: 1px solid #cfd8e3;
      border-radius: 12px;
      padding: 20px;
      margin: 18px 0;
      text-align: left;
    }

    .audio-box h2 {
      margin-top: 0;
      font-size: 19px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .nota {
      color: #666;
      font-size: 15px;
    }

    .indietro {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 22px;
      border: 2px solid #4b79a1;
      border-radius: 10px;
      color: #1f2d3d;
      text-decoration: none;
      font-weight: bold;
      background: white;
    }
  </style>
</head>

<body>

<div class="contenitore">

  <h1>Registrazioni audio</h1>

  <div class="sottotitolo">
    Registrazioni originali del pellegrinaggio a Lourdes
  </div>

  <div id="elenco-audio">
    <div class="nota">Caricamento registrazioni...</div>
  </div>

  <a class="indietro" href="index.html">
    Torna alla pagina principale
  </a>

</div>

<script>

const proprietario = "roberto64rm";
const repository = "lourdes2026";
const cartella = "audio";

async function caricaAudio() {

  const contenitore = document.getElementById("elenco-audio");

  const url =
    `https://api.github.com/repos/${proprietario}/${repository}/contents/${cartella}`;

  try {

    const risposta = await fetch(url);

    if (!risposta.ok) {
      contenitore.innerHTML =
        '<div class="nota">Nessuna registrazione disponibile</div>';
      return;
    }

    const files = await risposta.json();

    const audioFiles = files
      .filter(file =>
        file.type === "file" &&
        /\.(mp3|wav|m4a|ogg)$/i.test(file.name)
      )
      .sort((a, b) => a.name.localeCompare(b.name));

    if (audioFiles.length === 0) {
      contenitore.innerHTML =
        '<div class="nota">Nessuna registrazione disponibile</div>';
      return;
    }

    contenitore.innerHTML = "";

    audioFiles.forEach(file => {

      const box = document.createElement("div");
      box.className = "audio-box";

      const titolo = document.createElement("h2");

      titolo.textContent = file.name
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g, " ");

      const player = document.createElement("audio");
      player.controls = true;
      player.preload = "none";
      player.src = file.download_url;

      box.appendChild(titolo);
      box.appendChild(player);

      contenitore.appendChild(box);

    });

  } catch (errore) {

    contenitore.innerHTML =
      '<div class="nota">Errore nel caricamento delle registrazioni</div>';

  }
}

caricaAudio();

</script>

</body>
</html>
