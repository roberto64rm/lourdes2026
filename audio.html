<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrazioni audio - Lourdes 2026</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
      color: #1f2d3d;
    }

    .contenitore {
      max-width: 850px;
      margin: 40px auto;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .sottotitolo {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .audio-box {
      background: white;
      border: 1px solid #cfd8e3;
      border-radius: 12px;
      padding: 20px;
      margin: 18px 0;
      text-align: left;
    }

    .audio-box h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .nota {
      color: #666;
      font-size: 15px;
    }

    .indietro {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 22px;
      border: 2px solid #4b79a1;
      border-radius: 10px;
      color: #1f2d3d;
      text-decoration: none;
      font-weight: bold;
      background: white;
    }

    .indietro:hover {
      background: #eaf2f8;
    }
  </style>
</head>

<body>

  <div class="contenitore">

    <h1>Registrazioni audio</h1>

    <div class="sottotitolo">
      Registrazioni originali del pellegrinaggio a Lourdes
    </div>

    <div class="audio-box">
      <h2>Don Giulio — riflessioni e omelia</h2>
      <div class="nota">Registrazione in preparazione</div>
    </div>

    <div class="audio-box">
      <h2>Bernadette — spiegazioni durante il viaggio</h2>
      <div class="nota">Registrazione in preparazione</div>
    </div>

    <div class="audio-box">
      <h2>Altre registrazioni</h2>
      <div class="nota">Materiale audio in preparazione</div>
    </div>

    <a class="indietro" href="index.html">
      Torna alla pagina principale
    </a>

  </div>

</body>
</html>
